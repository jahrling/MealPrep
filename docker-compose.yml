# Same project name and volume no matter who runs it or from which checkout,
# so `docker compose up -d --build` from anyone's clone replaces the one
# running container and keeps the same data.
name: dinnertable

services:
  dinnertable:
    build: .
    container_name: dinnertable
    restart: unless-stopped
    ports:
      - "8002:8002"
    # One shared secrets file, so the key is the same no matter whose checkout
    # rebuilds. Holds ANTHROPIC_API_KEY. Override the path with
    # DINNERTABLE_ENV_FILE. Without the file the app still runs, minus AI.
    env_file:
      - path: ${DINNERTABLE_ENV_FILE:-/etc/dinnertable.env}
        required: false
    volumes:
      - dinnertable-data:/data

volumes:
  dinnertable-data:
    name: dinnertable-data
