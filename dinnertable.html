<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
:root{
  --bg:#F8F4EE; --surface:#FFFFFF; --surface-2:#EFE8DF; --ink:#1F1B18; --ink-2:#6A5F57; --line:#E4DBD0;
  --accent:#AD3A26; --accent-soft:#F9E1DA; --on-accent:#FFFFFF;
  --gold:#8C5C00; --gold-soft:#FBEBC8;
  --berry:#8A3963; --berry-soft:#F3DFEA;
  --warn:#B03A2E; --shadow:0 10px 30px rgba(40,24,16,.18);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161210; --surface:#211A17; --surface-2:#2B221E; --ink:#EDE6DF; --ink-2:#A39A92; --line:#3B302A;
    --accent:#F2907A; --accent-soft:#3A1F19; --on-accent:#1A1210;
    --gold:#F0B94F; --gold-soft:#3A2C10;
    --berry:#E3A0C3; --berry-soft:#3A2130;
    --warn:#F08C80; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161210; --surface:#211A17; --surface-2:#2B221E; --ink:#EDE6DF; --ink-2:#A39A92; --line:#3B302A;
  --accent:#F2907A; --accent-soft:#3A1F19; --on-accent:#1A1210;
  --gold:#F0B94F; --gold-soft:#3A2C10;
  --berry:#E3A0C3; --berry-soft:#3A2130;
  --warn:#F08C80; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;flex:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-block:0 12px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}

/* week header */
.weekbar{display:flex;align-items:center;gap:6px;margin-block:4px 12px}
.weekbar h2{font-size:24px;font-weight:800;flex:1;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{border:0;background:none;width:34px;height:32px;font-size:18px;font-weight:600;color:var(--accent)}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2);margin-block:0 14px}
.summary b{color:var(--ink);font-weight:700}

/* day list */
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dstamp{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:11px;padding-block:6px}
.dstamp .dn{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.dstamp .dd{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.05}
.day.today .dstamp{background:var(--accent);color:var(--on-accent)}
.day.today .dstamp .dn{color:var(--on-accent)}
.dbody{display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.dname{font-weight:700;font-size:16px;line-height:1.25}
.dadd{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
.dspecial{color:var(--ink-2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.scratch{background:var(--accent-soft);color:var(--accent)}
.chip.shortcut{background:var(--gold-soft);color:var(--gold)}
.chip.newf{background:var(--berry-soft);color:var(--berry)}
.chip svg{width:12px;height:12px}
.vp{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sections */
.section{margin-top:22px}
.section h3{font-size:18px;font-weight:700;margin-block:0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.preplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.preplist li{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:14px}
.preplist .pd{font-weight:700;color:var(--accent);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
textarea,input[type=text],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.small{min-height:34px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* recipes */
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.rcard .rn{font-weight:700;font-size:16px}
.rcard .rb{font-size:13.5px;color:var(--ink-2)}
.votes{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* shopping */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{font-size:13px;padding:8px 4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.thumbs div{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0}
.scan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.scan h3{font-size:18px}
.scan p{margin:0;font-size:14px;color:var(--ink-2)}
.found .item{cursor:pointer}
.aisle{margin-top:16px}
.aisle h4{margin:0 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check svg{width:15px;height:15px}
.item .iname{font-weight:600;line-height:1.25}
.item .imeta{font-size:12.5px;color:var(--ink-2)}
.item.got .iname{text-decoration:line-through;color:var(--ink-2)}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.addrow2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.x{border:0;background:none;color:var(--ink-2);font-size:20px;width:32px;height:32px;flex:none}
details.have{margin-top:18px}
details.have summary{cursor:pointer;font-weight:700;color:var(--ink-2);font-size:14px;padding-block:6px}

/* ideas */
.idea{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.idea h3{font-size:19px}
.idea p{margin:0;font-size:14px;color:var(--ink-2)}
.idea.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.idea.hero p{color:var(--on-accent);opacity:.85}
.idea.hero .btn{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.idea.hero label{color:var(--on-accent)}
.status{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.idea.hero .status{color:var(--on-accent)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.results{display:flex;flex-direction:column;gap:8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 10px}
.sheet-head h2{font-size:22px;font-weight:800;flex:1;line-height:1.15}
.sheet-body{overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2)}
.meta b{color:var(--ink)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:14px}
.note .eyebrow{display:block;margin-bottom:2px}
.note.kid{background:var(--gold-soft);border-color:transparent}
.note.kid .eyebrow{color:var(--gold)}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ings li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14.5px}
.ings li:first-child{border-top:0}
.ings .q{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14.5px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--accent);font-size:17px;line-height:1.3}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.daypick button small{font-weight:500;color:var(--ink-2);font-size:11px}
.daypick button.full{background:var(--surface-2)}
.rating-row{display:flex;flex-direction:column;gap:6px}
.starbtn{border:0;background:none;padding:2px;font-size:22px;line-height:1;color:var(--line)}
.starbtn.on{color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{text-align:center;padding:28px 12px;color:var(--ink-2)}
.confirm{background:var(--berry-soft);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
label.inline{display:flex;align-items:center;gap:8px;font-size:14px}
label.inline input{width:18px;height:18px;accent-color:var(--accent)}
</style>

<script>
(function(){

const parseYmd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
function weekKeyOf(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return ymd(d)}
function dayDate(key,i){const d=parseYmd(key);d.setDate(d.getDate()+i);return d}
function shiftWeek(key,n){const d=parseYmd(key);d.setDate(d.getDate()+7*n);return ymd(d)}
function weekLabel(key){const a=dayDate(key,0),b=dayDate(key,6);return MONTHS[a.getMonth()]+' '+a.getDate()+' – '+(a.getMonth()===b.getMonth()?'':MONTHS[b.getMonth()]+' ')+b.getDate()}
function fmt(n){
  if(n==null||isNaN(n))return '';
  if(n>=10)return String(Math.round(n*2)/2).replace('.5','½');
  const w=Math.floor(n+1e-9),f=n-w;
  const fr=[[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let best=fr[0],bd=9;for(const x of fr){const d=Math.abs(f-x[0]);if(d<bd){bd=d;best=x}}
  if(bd>.07)return String(Math.round(n*10)/10);
  const W=w+(best[0]===1?1:0);const s=(W?W:'')+best[1];return s||'pinch';
}
const AISLE_WORDS=[
 ["Produce",/\b(onion|garlic|pepper(?!oni| flakes|corn)|carrot|broccoli|spinach|lettuce|kale|tomato(?!es, canned| sauce| paste)|potato|cucumber|zucchini|squash|celery|avocado|lime|lemon|apple|banana|berries|grape|cilantro|parsley|basil|green onion|scallion|mushroom|cabbage|slaw|green beans|corn on|sweet potato|ginger|asparagus|snap peas|salad)\b/],
 ["Meat & Seafood",/\b(chicken|beef|turkey|pork|sausage|bacon|salmon|shrimp|fish|steak|ground|meatball|ham)\b/],
 ["Deli & Bakery",/\b(rotisserie|bun|bread|tortilla|roll|pita|naan|bagel|deli)\b/],
 ["Dairy & Eggs",/\b(milk|cheese|cheddar|mozzarella|parmesan|butter|egg|yogurt|sour cream|cream|biscuit dough|crescent|pie crust)\b/],
 ["Frozen",/\b(frozen|quiche|nugget|tater|fries)\b/],
 ["Pasta, Rice & Grains",/\b(pasta|macaroni|noodle|spaghetti|penne|rice|quinoa|couscous|oats|breadcrumb|panko)\b/],
 ["Spices & Baking",/\b(salt|pepper flakes|black pepper|cumin|paprika|chili powder|oregano|seasoning|flour|sugar|cinnamon|garlic powder|onion powder|baking|vanilla|italian seasoning)\b/],
 ["Sauces & Condiments",/\b(ketchup|mustard|mayo|sauce|dressing|salsa|honey|vinegar|oil|marinara|teriyaki|soy|bbq|syrup|ranch)\b/],
 ["Pantry & Canned",/\b(canned|beans|broth|stock|tomatoes|peanut butter|coconut milk|chickpea|lentil)\b/],
 ["International",/\b(curry|gochujang|hoisin|sesame|taco shell|enchilada)\b/],
 ["Snacks & Drinks",/\b(chips|crackers|juice|pretzel|snack)\b/]
];
function guessAisle(name){const n=norm(name);for(const [a,re] of AISLE_WORDS){if(re.test(n))return a}return 'Other'}

function normRating(v){
  v=v&&typeof v==='object'?v:{};
  const out={};
  for(const p of PEOPLE){const e=v[p]&&typeof v[p]==='object'?v[p]:{};out[p]={stars:Math.max(0,Math.min(5,Math.round(Number(e.stars))||0)),note:String(e.note||'')}}
  return out;
}
function ratingAvg(r){const vals=PEOPLE.map(p=>r.rating[p].stars).filter(v=>v>0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}
function ratingCount(r){return PEOPLE.filter(p=>r.rating[p].stars>0).length}
function normVersion(v){
  v=v&&typeof v==='object'?v:{};
  return {time:Number(v.time)||0,
    ingredients:(Array.isArray(v.ingredients)?v.ingredients:[]).filter(x=>x&&x.name).map(x=>({name:String(x.name),amt:(x.amt===null||x.amt===undefined||x.amt===''||isNaN(Number(x.amt)))?null:Number(x.amt),unit:String(x.unit||''),aisle:AISLES.includes(x.aisle)?x.aisle:guessAisle(x.name)})),
    steps:(Array.isArray(v.steps)?v.steps:[]).map(String).filter(Boolean)};
}
function normRecipe(r){
  r=r&&typeof r==='object'?r:{};
  const out={name:String(r.name||'Untitled dinner'),blurb:String(r.blurb||''),protein:String(r.protein||''),
    veg:(Array.isArray(r.veg)?r.veg:[]).map(String),newFlavor:!!r.newFlavor,kidTip:String(r.kidTip||''),prepAhead:String(r.prepAhead||''),
    servings:Number(r.servings)||4,scratch:normVersion(r.scratch),shortcut:normVersion(r.shortcut),
    nutrition:r.nutrition&&typeof r.nutrition==='object'?{cal:Number(r.nutrition.cal)||0,protein:Number(r.nutrition.protein)||0,fiber:Number(r.nutrition.fiber)||0}:null,
    rating:normRating(r.rating),
    adjustments:(Array.isArray(r.adjustments)?r.adjustments:[]).filter(a=>a&&a.note).map(a=>({at:Number(a.at)||0,note:String(a.note),summary:String(a.summary||''),prev:a.prev&&typeof a.prev==='object'?a.prev:null})),
    source:String(r.source||'ai'),created:Number(r.created)||Date.now()};
  if(!out.scratch.ingredients.length&&out.shortcut.ingredients.length)out.scratch=clone(out.shortcut);
  if(!out.shortcut.ingredients.length&&out.scratch.ingredients.length)out.shortcut=clone(out.scratch);
  return out;
}
const ADJ_KEYS=['scratch','shortcut','kidTip','prepAhead','nutrition'];
function adjDate(ms){const d=new Date(ms);return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' · '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
const ver=(r,mode)=>(r&&(r[mode]&&r[mode].ingredients.length?r[mode]:r.shortcut))||{time:0,ingredients:[],steps:[]};

/* ---------- state ---------- */
const S={tab:'week',weekKey:weekKeyOf(new Date()),recipes:{},recipesLoaded:false,
  plan:{days:{},notes:''},shop:{have:{},got:{},extras:[]},pantry:{items:[]},inv:{items:[]},settings:{servings:4},
  scan:{files:[],urls:[],found:null,busy:false,msg:''},imgLimit:null,
  shopView:'list',rq:'',rfilter:'all',sheet:null,db:null,sample:null,dbState:'loading',readOnly:false,
  ai:{busy:null,msg:'',results:[],newOK:true,fridge:'',create:''},deferred:false};
let ctl=null,unsubPlan=null,unsubShop=null;

/* ---------- saving ---------- */
const Q={};
const busy=p=>Q[p]&&(Q[p].pending||Q[p].running||Q[p].timer);
function save(path,body){
  if(!S.db||S.readOnly)return;
  const q=Q[path]||(Q[path]={pending:null,running:false,timer:null});
  q.pending=clone(body);clearTimeout(q.timer);
  q.timer=setTimeout(()=>{q.timer=null;flush(path)},300);
}
async function flush(path){
  const q=Q[path];if(!q||q.running||!q.pending)return;
  const body=q.pending;q.pending=null;q.running=true;
  try{await S.db.doc(path).set(body)}catch(e){writeErr(e)}
  q.running=false;if(q.pending)flush(path);
}
function writeErr(e){
  if(e&&e.code==='invalid_argument'){S.readOnly=true;toast("You can view this planner but can't change it.");render(true)}
  else if(e&&e.code==='quota_exceeded'){toast('Storage is full. Delete a few recipes to make room.')}
  else toast("That change didn't save. Try again in a moment.");
}
const savePlan=()=>save('plans/'+S.weekKey,S.plan);
const saveShop=()=>save('shop/'+S.weekKey,S.shop);

/* ---------- data ---------- */
function subWeek(){
  if(unsubPlan)unsubPlan();if(unsubShop)unsubShop();
  S.plan={days:{},notes:''};S.shop={have:{},got:{},extras:[]};
  if(!S.db)return;
  const pk='plans/'+S.weekKey,sk='shop/'+S.weekKey;
  unsubPlan=S.db.doc(pk).onSnapshot(s=>{if(busy(pk))return;const d=s.exists?s.data():null;S.plan={days:clone((d&&d.days)||{}),notes:String((d&&d.notes)||'')};render()},onErr);
  unsubShop=S.db.doc(sk).onSnapshot(s=>{if(busy(sk))return;const d=s.exists?s.data():null;S.shop={have:clone((d&&d.have)||{}),got:clone((d&&d.got)||{}),extras:clone((d&&d.extras)||[])};render()},onErr);
}
function onErr(e){if(e&&e.code==='revoked'){S.dbState='off';render(true)}}

function plannedEntries(){
  const out=[];for(let d=0;d<7;d++){const e=S.plan.days[d];if(e)out.push([d,e,e.recipeId?S.recipes[e.recipeId]:null])}return out;
}
function nameMatch(list,name){
  const n=norm(name);
  return list.some(p=>{const k=norm(p.name);if(!k)return false;return n===k||new RegExp('(^|\\s)'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\s|$)').test(n)});
}
function atHome(name){return nameMatch(S.pantry.items,name)?'Pantry staple':nameMatch(S.inv.items,name)?'On hand':''}
function inPantry(name){return !!atHome(name)}
const saveInv=()=>save('inventory/current',S.inv);
function onHandText(){return S.inv.items.map(i=>i.name+(i.qty?` (${i.qty})`:'')).join(', ')}
function shopItems(){
  const map=new Map();
  for(let d=0;d<7;d++){
    const e=S.plan.days[d];if(!e||!e.recipeId)continue;const r=S.recipes[e.recipeId];if(!r)continue;
    const v=ver(r,e.mode);const f=(e.servings||S.settings.servings)/(r.servings||4);
    for(const g of v.ingredients){
      const k=norm(g.name);let it=map.get(k);
      if(!it){it={key:k,name:g.name,aisle:g.aisle,parts:{},days:[],extra:false};map.set(k,it)}
      const u=norm(g.unit);if(g.amt!=null)it.parts[u]=(it.parts[u]||0)+g.amt*f;else if(!(u in it.parts))it.parts[u]=0;
      if(!it.days.includes(DAYS[d]))it.days.push(DAYS[d]);
    }
  }
  for(const x of S.shop.extras){map.set('x:'+x.id,{key:'x:'+x.id,id:x.id,name:x.name,aisle:x.aisle||guessAisle(x.name),qty:x.qty||'',days:[],extra:true})}
  return [...map.values()].map(it=>{
    const qty=it.extra?it.qty:Object.entries(it.parts).map(([u,a])=>a?fmt(a)+(u?' '+u:''):'').filter(Boolean).join(' + ');
    const have=(it.key in S.shop.have)?!!S.shop.have[it.key]:(!it.extra&&inPantry(it.name));
    return {...it,qty,have,got:!!S.shop.got[it.key]};
  });
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const modeChip=m=>m==='scratch'?`<span class="chip scratch">${I.leaf}Scratch</span>`:`<span class="chip shortcut">${I.bolt}Shortcut</span>`;
const newChip=r=>r.newFlavor?'<span class="chip newf">New flavor</span>':'';
const vp=r=>`<div class="vp">${esc(r.protein)}${r.veg.length?' · '+esc(r.veg.join(', ')):''}</div>`;
const dots='<span class="dots"><i></i><i></i><i></i></span>';

/* ---------- WEEK ---------- */
function viewWeek(){
  const today=ymd(new Date());
  const ents=plannedEntries();
  const meals=ents.filter(([, ,r])=>r);
  const veg=new Set();meals.forEach(([, ,r])=>r.veg.forEach(v=>veg.add(norm(v))));
  const newF=meals.filter(([, ,r])=>r.newFlavor).length;
  let h=`<div class="weekbar"><button class="iconbtn" data-a="wk" data-v="-1" aria-label="Previous week">${I.left}</button><h2>${weekLabel(S.weekKey)}</h2><button class="iconbtn" data-a="wk" data-v="1" aria-label="Next week">${I.right}</button></div>`;
  h+=`<div class="summary"><span><b class="num">${meals.length}</b> of 7 dinners planned</span><span><b class="num">${veg.size}</b> different veggies</span><span><b class="num">${newF}</b> new flavor${newF===1?'':'s'}</span>
  <span class="row" style="margin-left:auto">Cooking for <span class="stepper"><button data-a="fam" data-v="-1" aria-label="Fewer servings">−</button><span class="num">${S.settings.servings}</span><button data-a="fam" data-v="1" aria-label="More servings">+</button></span></span></div>`;
  if(!S.recipesLoaded&&S.dbState==='loading')return h+'<div class="empty">Loading your kitchen…</div>';
  h+='<div class="days">';
  for(let d=0;d<7;d++){
    const dt=dayDate(S.weekKey,d),e=S.plan.days[d],isT=ymd(dt)===today;
    const stamp=`<div class="dstamp"><span class="dn">${DAYS[d]}</span><span class="dd num">${dt.getDate()}</span></div>`;
    let body;
    if(!e)body=`<div class="dadd">${I.plus.replace('<svg','<svg width="16" height="16"')} Add dinner</div>`;
    else if(e.type==='leftovers')body='<div class="dname">Leftovers night</div><div class="dspecial" style="font-size:13px">Clean out the fridge</div>';
    else if(e.type==='out')body='<div class="dname">Eating out</div><div class="dspecial" style="font-size:13px">No cooking tonight</div>';
    else{const r=S.recipes[e.recipeId];
      body=r?`<div class="dname">${esc(r.name)}</div><div class="chips">${modeChip(e.mode)}<span class="chip num">${ver(r,e.mode).time} min</span>${e.servings&&e.servings!==S.settings.servings?`<span class="chip num">Serves ${e.servings}</span>`:''}${newChip(r)}</div>${vp(r)}`
        :'<div class="dname muted">Recipe was deleted</div><div class="dadd" style="font-size:13px">Tap to choose another</div>';}
    const act=!e||(e.recipeId&&!S.recipes[e.recipeId])?`data-a="pick" data-day="${d}"`:e.type?`data-a="pick" data-day="${d}"`:`data-a="openday" data-day="${d}"`;
    h+=`<button class="day${isT?' today':''}" ${act} aria-label="${DAYS_LONG[d]}">${stamp}<div class="dbody">${body}</div></button>`;
  }
  h+='</div>';
  const open=7-ents.length;
  h+=`<div class="btnrow" style="margin-top:12px"><button class="btn primary grow" data-a="goplan" ${open?'':'disabled'}>${I.spark} ${open?`Fill ${open} open night${open===1?'':'s'} with AI`:'Week is full'}</button>${ents.length?'<button class="btn ghost" data-a="clearweek">Clear week</button>':''}</div>`;
  if(S.confirmClear)h+=`<div class="confirm" style="margin-top:8px"><span class="grow">Remove every dinner from this week?</span><button class="btn small danger" data-a="clearyes">Clear it</button><button class="btn small" data-a="clearno">Keep</button></div>`;
  const prep=meals.filter(([, ,r])=>r.prepAhead);
  h+=`<section class="section"><h3>Sunday prep</h3>`;
  h+=prep.length?`<div class="panel"><ul class="preplist">${prep.map(([d,e,r])=>`<li><span class="pd">${DAYS[d]}</span><span><b>${esc(r.name)}.</b> ${esc(r.prepAhead)}</span></li>`).join('')}</ul></div>`
    :'<p class="muted" style="margin:0">Add dinners and their make-ahead steps show up here, so Sunday prep is one list.</p>';
  h+=`</section><section class="section"><h3>Notes for the week</h3><textarea id="notes" data-bind="notes" placeholder="Soccer Tuesday, grandparents over Saturday…">${esc(S.plan.notes)}</textarea></section>`;
  return h;
}

/* ---------- RECIPES ---------- */
function filteredRecipes(){
  const q=norm(S.rq);
  return Object.entries(S.recipes).filter(([id,r])=>{
    if(q&&!norm(r.name+' '+r.protein+' '+r.veg.join(' ')+' '+r.blurb).includes(q))return false;
    if(S.rfilter==='fav')return ratingAvg(r)>=4;
    if(S.rfilter==='new')return r.newFlavor;
    if(S.rfilter==='quick')return ver(r,'shortcut').time<=30;
    if(S.rfilter==='ai')return r.source==='ai';
    return true;
  }).sort((a,b)=>ratingAvg(b[1])-ratingAvg(a[1])||a[1].name.localeCompare(b[1].name));
}
function recipeListHTML(list,action){
  if(!list.length)return '<div class="empty">No recipes match. Try another search, or ask for one in Ideas.</div>';
  return list.map(([id,r])=>{const n=ratingCount(r);return `<button class="rcard" data-a="${action}" data-id="${esc(id)}"><div class="row"><span class="rn grow">${esc(r.name)}</span>${n?`<span class="votes num">★${ratingAvg(r).toFixed(1)} (${n})</span>`:''}</div>${r.blurb?`<div class="rb">${esc(r.blurb)}</div>`:''}<div class="chips"><span class="chip scratch num">${I.leaf}${r.scratch.time} min</span><span class="chip shortcut num">${I.bolt}${r.shortcut.time} min</span>${newChip(r)}</div>${vp(r)}</button>`}).join('');
}
function viewRecipes(){
  const fs=[['all','All'],['fav','Family favorites'],['quick','Shortcut ≤30 min'],['new','New flavors'],['ai','Made with AI']];
  let h=`<input type="search" id="rq" data-bind="rq" placeholder="Search chicken, broccoli, tacos…" value="${esc(S.rq)}" aria-label="Search recipes">`;
  h+=`<div class="filters">${fs.map(([k,l])=>`<button class="fchip${S.rfilter===k?' on':''}" data-a="rf" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(!S.recipesLoaded&&S.dbState==='loading')return h+'<div class="empty">Loading recipes…</div>';
  h+=`<div class="rlist" id="rlist">${recipeListHTML(filteredRecipes(),'openrec')}</div>`;
  h+=`<button class="btn" style="width:100%;margin-top:12px" data-a="tab" data-v="ideas">${I.spark} Create a new recipe with AI</button>`;
  return h;
}

function viewOnHand(){
  const sc=S.scan,canImg=S.sample&&S.imgLimit&&S.imgLimit.images;
  let h='';
  h+=`<div class="scan"><h3>Snap your fridge and cabinets</h3>`;
  {
    const max=canImg?S.imgLimit.images.maxCount:5;
    h+=`<p>Take a photo of each fridge shelf, the freezer and your cabinets (up to ${max} at a time). Claude lists what it sees, you check the list, and those items get used first when planning dinners.</p>`;
    if(sc.urls.length)h+=`<div class="thumbs">${sc.urls.map((u,i)=>`<div><img src="${u}" alt="Photo ${i+1}"><button data-a="phdel" data-i="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join('')}</div>`;

  }

function recipeDetail(r,o){
  const v=ver(r,o.mode),f=o.servings/(r.servings||4);
  let h=`<div class="chips">${newChip(r)}${r.source==='ai'?'<span class="chip">Made with AI</span>':''}</div>`;
  if(r.blurb)h+=`<p style="margin:0" class="muted">${esc(r.blurb)}</p>`;

  h+=`<div class="meta"><span>Protein <b>${esc(r.protein)}</b></span>${r.veg.length?`<span>Veggies <b>${esc(r.veg.join(', '))}</b></span>`:''}</div>`;
  h+=`<div class="row"><span class="grow" style="font-weight:600">Servings</span><span class="stepper"><button data-a="sserv" data-v="-1" aria-label="Fewer">−</button><span class="num">${o.servings}</span><button data-a="sserv" data-v="1" aria-label="More">+</button></span></div>`;
  if(r.nutrition&&r.nutrition.cal)h+=`<div class="meta num"><span>About <b>${Math.round(r.nutrition.cal)}</b> cal</span><span><b>${Math.round(r.nutrition.protein)} g</b> protein</span><span><b>${Math.round(r.nutrition.fiber)} g</b> fiber</span><span>per serving, estimated</span></div>`;
  if(r.kidTip)h+=`<div class="note kid"><span class="eyebrow">For the boys</span>${esc(r.kidTip)}</div>`;
  if(r.prepAhead)h+=`<div class="note"><span class="eyebrow">Sunday prep</span>${esc(r.prepAhead)}</div>`;
  h+=`<div><div class="eyebrow" style="margin-bottom:6px">Ingredients</div><ul class="ings">${v.ingredients.map(g=>`<li><span class="q">${g.amt!=null?esc(fmt(g.amt*f)+(g.unit?' '+g.unit:'')):esc(g.unit||'to taste')}</span><span>${esc(g.name)}</span></li>`).join('')}</ul></div>`;
  h+=`<div><div class="eyebrow" style="margin-bottom:8px">Steps</div><ol class="steps">${v.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>`;
  return h;
}
function dayPickHTML(action){

    }).join('')}</div></div>`;

    body+=`<div><div class="eyebrow" style="margin-bottom:6px">Remix with AI</div><div class="btnrow">${[['faster','Make it faster'],['veg','Sneak in more veggies'],['kid','More kid-friendly'],['flavor','New flavor twist']].map(([k,l])=>`<button class="btn small" data-a="remix" data-v="${k}" ${S.ai.busy||!S.sample?'disabled':''}>${l}</button>`).join('')}</div>${S.ai.busy==='remix'?`<div class="status" style="margin-top:8px">${dots}<span class="grow">${esc(S.ai.msg)}</span><button class="btn small" data-a="stop">Stop</button></div>`:(S.ai.lastKey==='remix'&&S.ai.msg?`<div class="status" style="margin-top:8px">${esc(S.ai.msg)}</div>`:'')}</div>`;

  }else if(sh.type==='preview'){
    const r=S.ai.results[sh.i];if(!r){S.sheet=null;el.innerHTML='';return}

    body+=r._saved?'<div class="note">Saved to your recipe box.</div>':`<button class="btn primary" data-a="psave">Save to recipe box</button><div><div class="eyebrow" style="margin-bottom:6px">Or save and add to this week</div>${dayPickHTML('psaveday')}</div>`;

  if(prevType===el.dataset.type){const nb=el.querySelector('.sheet-body');if(nb)nb.scrollTop=prevTop}
}
function pickList(){const q=norm(S.sheet&&S.sheet.q);return Object.entries(S.recipes).filter(([,r])=>!q||norm(r.name+' '+r.protein+' '+r.veg.join(' ')).includes(q)).sort((a,b)=>ratingAvg(b[1])-ratingAvg(a[1])||a[1].name.localeCompare(b[1].name))}
const defaultMode=d=>(d>=1&&d<=4)?'shortcut':'scratch';

/* ---------- AI ---------- */
const FAMILY=`Family: two adults and two boys, ages 2 and 6. No food allergies. The boys prefer kid-friendly food (they love mac and cheese, hamburgers, chicken nuggets and frozen quiche) and their pickiness changes day to day. The parents want the kids to eat more vegetables and gently explore new flavors. Every dinner must include a protein and at least one vegetable. They shop at Hy-Vee in Iowa. Weeknights are busy; they do some prep on Sundays and some cooking nightly.`;
const SHAPE=`Each recipe is a JSON object with exactly these fields:
{"name": string, "blurb": one short sentence, "protein": string, "veg": [vegetable names], "newFlavor": true if it introduces a flavor or cuisine the kids probably haven't had,
"kidTip": one practical sentence on serving it to a 2-year-old and a 6-year-old (safe cuts for the toddler, deconstructed plates, dips),
"prepAhead": one sentence on what can be done on Sunday, or "",
"servings": 4,
"scratch": {"time": total minutes, "ingredients": [{"name": plain grocery name, "amt": number or null, "unit": string like "cup", "tbsp", "lb", "" for whole items, "aisle": one of ${JSON.stringify(AISLES)}}], "steps": [short plain steps]},
"shortcut": same shape as scratch, but using store-bought helpers where they save real time: rotisserie chicken, taco or ranch seasoning packets instead of separate spices, frozen or pre-cut vegetables, jarred sauces, microwave rice, refrigerated dough, bagged salad kits,
"nutrition": {"cal": number, "protein": grams, "fiber": grams} per serving, estimated}
Ingredient names never contain quantities. List oil, salt and spices as ingredients. Keep steps short and plain.`;
function aiStart(key,msg){ctl=new AbortController();S.ai.busy=key;S.ai.lastKey=key;S.ai.msg=msg;render(true);return ctl.signal}
function aiEnd(msg){S.ai.busy=null;S.ai.msg=msg||'';render(true)}
function aiErr(e){
  const c=e&&e.code;
  if(c==='cancelled')return aiEnd('Stopped.');
  if(c==='not_granted'||c==='sampling_disabled'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){return aiEnd('AI help needs an ANTHROPIC_API_KEY set on the server. Ask whoever runs it to add one and restart.')}
  if(c==='rate_limited')return aiEnd("You've hit your usage limit for now. Try again a bit later.");
  if(c==='session_expired')return aiEnd('Sign in to Claude again, then retry.');
  if(c==='invalid_json'||c==='empty_completion')return aiEnd("The answer came back garbled. Tap the button to try again.");
  if(c==='refused')return aiEnd("Claude couldn't help with that one. Try wording it differently.");
  return aiEnd('Something went wrong on the way. Tap the button to try again.');
}
function recipeSummary(){return Object.entries(S.recipes).map(([id,r])=>{
  const ratings=PEOPLE.map(p=>{const pr=r.rating[p];return pr.stars?`${p} ${pr.stars}★${pr.note?' ('+pr.note+')':''}`:null}).filter(Boolean).join(', ');
  return `${id} | ${r.name} | ${r.protein} | veg: ${r.veg.join(', ')} | shortcut ${r.shortcut.time} min | ratings: ${ratings||'none yet'}${r.newFlavor?' | new flavor':''}`;
}).join('\n')}
async function aiPlan(){
  if(!S.sample)return;
  const open=[];for(let d=0;d<7;d++)if(!S.plan.days[d])open.push(d);
  if(!open.length)return;
  const newOK=S.ai.newOK;
  if(!newOK&&!Object.keys(S.recipes).length)return aiEnd('Save a few recipes first, or allow brand-new ones.');
  const taken=plannedEntries().filter(([, ,r])=>r).map(([d,,r])=>`${DAYS_LONG[d]}: ${r.name}`).join('; ')||'none';
  const hand=onHandText();
  const prompt=`You plan family dinners.\n${FAMILY}\n\nSaved recipes (id | name | protein | veg | shortcut time | family votes):\n${recipeSummary()||'(none yet)'}\n\nAlready planned this week: ${taken}.\n${hand?`Food they already have at home (use these, and plan perishables like produce, dairy and fresh meat earlier in the week): ${hand}.\n`:''}Plan dinner for these open nights:`+` ${open.map(d=>`${d}=${DAYS_LONG[d]}`).join(', ')}.\nRules: vary the proteins across the week and don't repeat a recipe; ${hand?'prefer recipes that use what they have on hand; ':''}lean on recipes the family loved and skip ones that were not a hit; use "shortcut" mode Monday–Thursday and "scratch" on weekends unless there's a reason not to; ${newOK?'invent 1 or 2 new recipes (as newRecipe objects), ideally built around on-hand food, and make at least one night a gentle new flavor for the kids':'use only saved recipes'}.\n${newOK?SHAPE+'\n':''}Reply with only JSON: {"days":[{"day": day number from the list, "recipeId": "an id from the saved list"${newOK?' OR "newRecipe": {recipe object}':''}, "mode": "scratch" or "shortcut"}]}`;
  const signal=aiStart('plan','Planning your week… this can take a minute.');
  try{
    const out=await S.sample.json(prompt,{signal,cache:false});
    const days=Array.isArray(out&&out.days)?out.days:[];
    let n=0,made=0;
    for(const x of days){
      const d=Number(x.day);if(!open.includes(d)||S.plan.days[d])continue;
      const mode=x.mode==='scratch'?'scratch':'shortcut';
      let id=x.recipeId&&S.recipes[x.recipeId]?x.recipeId:null;
      if(!id&&x.newRecipe&&newOK){id=await addRecipe(normRecipe({...x.newRecipe,source:'ai'}));if(id)made++}
      if(id){S.plan.days[d]={recipeId:id,mode,servings:null};n++}
    }
    savePlan();
    aiEnd(n?`Added ${n} dinner${n===1?'':'s'}${made?`, including ${made} new recipe${made===1?'':'s'}`:''}. Check the Week tab.`:'No dinners came back. Try again.');
    if(n){S.tab='week';render(true);toast(`Planned ${n} dinner${n===1?'':'s'}`)}
  }catch(e){aiErr(e)}
}
async function aiRecipes(key,instruction,count){
  if(!S.sample)return;
  const prompt=`You write family dinner recipes.\n${FAMILY}\n\n${SHAPE}\n\n${instruction}\n\nReply with only ${count>1?`a JSON array of ${count} recipe objects`:'one JSON recipe object'}.`;
  const signal=aiStart(key,count>1?'Coming up with ideas… usually under a minute.':'Writing your recipe… usually under a minute.');
  try{
    let out=await S.sample.json(prompt,{signal,cache:false});
    const list=(Array.isArray(out)?out:[out]).filter(x=>x&&typeof x==='object'&&x.name).map(x=>normRecipe({...x,source:'ai'}));
    if(!list.length)return aiEnd('Nothing usable came back. Try again.');
    S.ai.results=list.concat(S.ai.results).slice(0,12);
    aiEnd(`${list.length} new idea${list.length===1?'':'s'} below. Open one to save it.`);
    if(key==='remix'){S.sheet={type:'preview',i:0,mode:'shortcut',servings:S.settings.servings};render(true)}
  }catch(e){aiErr(e)}
}
async function addRecipe(r){
  if(!S.db){const id='local-'+Date.now()+Math.random().toString(36).slice(2,6);S.recipes[id]=r;return id}
  try{const ref=S.db.collection('recipes').doc();const body=clone(r);delete body._saved;await ref.set(body);S.recipes[ref.id]=r;return ref.id}
  catch(e){writeErr(e);return null}
}
async function saveRecipe(id){
  const r=S.recipes[id];if(!r)return;
  if(!S.db||S.readOnly)return;
  try{await S.db.doc('recipes/'+id).set(clone(r))}catch(e){writeErr(e)}
}

async function aiScan(){
  const sc=S.scan;if(!sc.files.length||sc.busy)return;
  ctl=new AbortController();sc.busy=true;sc.msg='Looking through your photos… usually under a minute.';render(true);
  const prompt=`These ${sc.files.length} photo${sc.files.length===1?'':'s'} show the inside of a family's refrigerator, freezer and/or kitchen cabinets. List the food items you can clearly identify that could be used to cook dinner. Skip non-food items, drinks that aren't cooking ingredients, and anything you can't actually make out. Combine duplicates across photos. Use plain grocery names without brands ("shredded cheddar", "baby carrots", "canned black beans", "frozen peas"). Give a rough amount only when it's obvious ("about half full", "2 cans", "1 bag"), otherwise "". "aisle" must be one of ${JSON.stringify(AISLES)}.\nReply with only a JSON array of {"name": string, "qty": string, "aisle": string}.`;
  try{
    const out=await S.sample.json(prompt,{images:sc.files,signal:ctl.signal,cache:false});
    const raw=Array.isArray(out)?out:(out&&Array.isArray(out.items)?out.items:[]);
    const seen=new Set();
    sc.found=raw.filter(x=>x&&x.name&&!seen.has(norm(x.name))&&seen.add(norm(x.name))).map(x=>({name:String(x.name),qty:String(x.qty||''),aisle:AISLES.includes(x.aisle)?x.aisle:guessAisle(x.name),on:true}));
    sc.busy=false;sc.msg=sc.found.length?'':"I couldn't make out any food. Try closer, brighter photos.";
    if(!sc.found.length)sc.found=null;
    render(true);
  }catch(e){
    sc.busy=false;const c=e&&e.code;
    sc.msg=c==='cancelled'?'Stopped.':c==='image_rejected'?'One of the photos couldn\'t be read. Remove it or try a different one.':c==='images_unavailable'?'Photos couldn\'t be sent to the server. Try fewer or smaller photos, or add items by hand below.':c==='rate_limited'?"You've hit your usage limit for now. Try again a bit later.":(c==='not_granted'||c==='sampling_disabled')?'AI help is turned off for this planner.':c==='invalid_json'||c==='empty_completion'?'The list came back garbled. Tap Find ingredients to try again.':'Something went wrong. Tap Find ingredients to try again.';
    render(true);
  }
}
function addPhotos(files){
  const sc=S.scan,max=(S.imgLimit&&S.imgLimit.images&&S.imgLimit.images.maxCount)||5;
  const types=(S.imgLimit&&S.imgLimit.images&&S.imgLimit.images.mediaTypes)||null;
  let skipped=0;
  for(const f of files){
    if(sc.files.length>=max){skipped++;continue}
    if(types&&!types.includes(f.type)&&!/^image\//.test(f.type)){skipped++;continue}
    sc.files.push(f);sc.urls.push(URL.createObjectURL(f));
  }
  sc.msg='';sc.found=null;
  if(skipped)toast(`Only ${max} photos fit in one scan. Scan these, then add more.`);
  render(true);
}
function clearPhotos(){S.scan.urls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});S.scan.files=[];S.scan.urls=[]}

/* ---------- actions ---------- */
const A={
  tab:t=>{S.tab=t.dataset.v;S.sheet=null;window.scrollTo(0,0);render(true)},
  wk:t=>{S.weekKey=shiftWeek(S.weekKey,Number(t.dataset.v));S.confirmClear=false;subWeek();render(true)},
  fam:t=>{S.settings.servings=Math.max(1,Math.min(12,S.settings.servings+Number(t.dataset.v)));save('settings/family',S.settings);render(true)},
  pick:t=>{const d=Number(t.dataset.day);const e=S.plan.days[d];S.sheet={type:'pick',day:d,mode:(e&&e.mode)||defaultMode(d),q:''};render(true)},
  openday:t=>{const d=Number(t.dataset.day);S.ai.msg='';S.sheet={type:'recipe',id:S.plan.days[d].recipeId,day:d};render(true)},
  openrec:t=>{S.ai.msg='';S.sheet={type:'recipe',id:t.dataset.id,mode:'shortcut',servings:S.settings.servings};render(true)},

  scrim:(t,ev)=>{if(ev.target===t){S.sheet=null;render(true)}},

  special:t=>{const d=S.sheet.day;S.plan.days[d]={type:t.dataset.v};savePlan();S.sheet=null;render(true)},
  rmday:()=>{const d=S.sheet.day;delete S.plan.days[d];savePlan();S.sheet=null;render(true);toast(`${DAYS_LONG[d]} cleared`)},
  swap:()=>{const d=S.sheet.day;S.sheet={type:'pick',day:d,mode:S.plan.days[d].mode||defaultMode(d),q:''};render(true)},
  smode:t=>{const sh=S.sheet;if(sh.type==='recipe'&&sh.day!=null){S.plan.days[sh.day].mode=t.dataset.v;savePlan()}else sh.mode=t.dataset.v;render(true)},
  sserv:t=>{const sh=S.sheet,dv=Number(t.dataset.v);
    if(sh.type==='recipe'&&sh.day!=null){const e=S.plan.days[sh.day];const v=Math.max(1,Math.min(16,(e.servings||S.settings.servings)+dv));e.servings=v===S.settings.servings?null:v;savePlan()}
    else sh.servings=Math.max(1,Math.min(16,sh.servings+dv));render(true)},
  rate:t=>{const r=S.recipes[S.sheet.id];if(!r)return;const p=t.dataset.person,v=Number(t.dataset.v);r.rating[p].stars=r.rating[p].stars===v?0:v;saveRecipe(S.sheet.id);render(true)},
  addday:t=>{const d=Number(t.dataset.day);S.plan.days[d]={recipeId:S.sheet.id,mode:S.sheet.mode,servings:S.sheet.servings===S.settings.servings?null:S.sheet.servings};savePlan();render(true);toast(`Added to ${DAYS_LONG[d]}`)},
  del:()=>{S.sheet.confirmDel=true;render(true)},
  delno:()=>{S.sheet.confirmDel=false;render(true)},
  delyes:async()=>{const id=S.sheet.id;delete S.recipes[id];S.sheet=null;render(true);if(S.db&&!S.readOnly){try{await S.db.doc('recipes/'+id).delete()}catch(e){writeErr(e)}}toast('Recipe deleted')},
  adjust:async()=>{
    const id=S.sheet&&S.sheet.id,r=id&&S.recipes[id];if(!r||S.ai.busy)return;
    const note=(S.sheet.adj||'').trim();if(!note){S.ai.lastKey='adjust';return aiEnd('Write a note first.')}
    const base=clone(r);['rating','adjustments','source','created'].forEach(k=>delete base[k]);
    const past=r.adjustments.map(a=>`- ${adjDate(a.at)}: ${a.note}`).join('\n');
    const prompt=`You adjust a family's saved dinner recipe using notes from actually cooking it.\n${FAMILY}\n\nCurrent recipe as JSON:\n${JSON.stringify(base)}\n\n${past?`Earlier cooking notes, already applied (keep those improvements unless the new note contradicts them):\n${past}\n\n`:''}New note from the cook: "${note}"\n\nUpdate the recipe so it goes better next time. Change only what the note calls for and keep everything else as is; if the note only concerns one version (scratch or shortcut), leave the other unchanged. Adjust times, amounts and steps as needed, and keep the ingredient shape: {"name": plain grocery name, "amt": number or null, "unit": string, "aisle": one of ${JSON.stringify(AISLES)}}.\nReply with only JSON: {"summary": one or two plain sentences on what you changed and why, "scratch": {"time": minutes, "ingredients": [...], "steps": [...]}, "shortcut": same shape, "kidTip": string, "prepAhead": string, "nutrition": {"cal": number, "protein": grams, "fiber": grams}}`;
    const signal=aiStart('adjust','Adjusting the recipe… usually under a minute.');
    try{
      const out=await S.sample.json(prompt,{signal,cache:false});
      const okVer=v=>v&&typeof v==='object'&&Array.isArray(v.ingredients)&&v.ingredients.length&&Array.isArray(v.steps)&&v.steps.length;
      if(!out||typeof out!=='object'||!okVer(out.scratch)||!okVer(out.shortcut))return aiEnd("Nothing usable came back. Your note is still here. Tap the button to try again.");
      const cur=S.recipes[id];if(!cur)return aiEnd('');
      const merged=normRecipe({...cur,...ADJ_KEYS.reduce((o,k)=>(out[k]!==undefined&&(k!=='nutrition'||(out[k]&&typeof out[k]==='object'))&&(o[k]=out[k]),o),{})});
      const prev={};ADJ_KEYS.forEach(k=>prev[k]=clone(cur[k]));
      merged.adjustments=cur.adjustments.concat([{at:Date.now(),note,summary:String(out.summary||''),prev}]).map((a,i,arr)=>i<arr.length-5?{...a,prev:null}:a);
      S.recipes[id]=merged;
      if(S.sheet&&S.sheet.id===id)S.sheet.adj='';
      saveRecipe(id);aiEnd('');toast('Recipe adjusted');
    }catch(e){aiErr(e)}
  },
  adjundo:()=>{
    const id=S.sheet&&S.sheet.id,r=id&&S.recipes[id];if(!r||S.ai.busy)return;
    const last=r.adjustments[r.adjustments.length-1];if(!last||!last.prev)return;
    const restored=normRecipe({...r,...last.prev});
    restored.adjustments=r.adjustments.slice(0,-1);
    S.recipes[id]=restored;S.ai.msg='';saveRecipe(id);render(true);toast('Change undone');
  },
  remix:t=>{const r=S.recipes[S.sheet.id];if(!r)return;const goal={faster:'faster for a busy weeknight, with a shortcut version under 25 minutes',veg:'packed with more vegetables, some hidden and some visible, while staying kid-friendly',kid:'more kid-friendly for picky days, with familiar textures and a dip or build-your-own element',flavor:'a gentle new-flavor twist (a different cuisine or spice profile) that is still mild enough for a 2-year-old'}[t.dataset.v];
    const base=clone(r);delete base.rating;delete base.adjustments;delete base.source;delete base.created;
    aiRecipes('remix',`Here is a saved recipe as JSON:\n${JSON.stringify(base)}\n\nRework it to be ${goal}. Keep what makes it appealing to the kids. Give it a new name.`,1)},
  goplan:()=>{S.tab='ideas';render(true);aiPlan()},
  clearweek:()=>{S.confirmClear=true;render(true)},
  clearno:()=>{S.confirmClear=false;render(true)},
  clearyes:()=>{S.plan.days={};S.confirmClear=false;savePlan();render(true)},
  rf:t=>{S.rfilter=t.dataset.v;render(true)},
  sv:t=>{S.shopView=t.dataset.v;render(true)},
  got:t=>{const k=t.dataset.k;if(S.shop.got[k])delete S.shop.got[k];else S.shop.got[k]=true;saveShop();render(true)},
  have:t=>{const k=t.dataset.k,v=t.dataset.v==='1';const items=shopItems();const it=items.find(i=>i.key===k);const pantryDefault=it&&!it.extra&&inPantry(it.name);
    if(v===pantryDefault)delete S.shop.have[k];else S.shop.have[k]=v;saveShop();render(true);if(v)toast(`${it?it.name:'Item'} marked as home`)},
  haveopen:(t,ev)=>{ev.preventDefault();S.haveOpen=!S.haveOpen;render(true)},
  uncheck:()=>{S.shop.got={};saveShop();render(true)},
  extra:()=>{const inp=$('#extraName');const name=(inp.value||'').trim();if(!name)return inp.focus();S.shop.extras.push({id:Date.now().toString(36),name,qty:'',aisle:guessAisle(name)});saveShop();render(true);const n=$('#extraName');if(n)n.focus()},
  xdel:t=>{S.shop.extras=S.shop.extras.filter(x=>x.id!==t.dataset.id);delete S.shop.got['x:'+t.dataset.id];saveShop();render(true)},
  copy:t=>{const items=shopItems().filter(i=>!i.have&&!i.got);const by={};items.forEach(i=>(by[i.aisle]=by[i.aisle]||[]).push(i));
    const txt=`Hy-Vee list · ${weekLabel(S.weekKey)}\n`+AISLES.filter(a=>by[a]).map(a=>`\n${a.toUpperCase()}\n`+by[a].map(i=>`- ${i.name}${i.qty?' ('+i.qty+')':''}`).join('\n')).join('\n');
    const done=()=>toast('List copied. Paste it into a text or note.');
    try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done))}catch(e){fallbackCopy(txt,done)}},
  padd:()=>{const n=$('#pName'),a=$('#pAisle');const name=(n.value||'').trim();if(!name)return n.focus();S.pantry.items.push({name,aisle:a.value});save('pantry/staples',S.pantry);render(true);const nn=$('#pName');if(nn)nn.focus()},
  pdel:t=>{S.pantry.items.splice(Number(t.dataset.i),1);save('pantry/staples',S.pantry);render(true)},
  newok:t=>{S.ai.newOK=t.checked},
  aiplan:()=>aiPlan(),
  aifridge:()=>{const v=(S.ai.fridge||'').trim();if(!v){toast('List a few things you have first.');return $('#fridge').focus()}aiRecipes('fridge',`Suggest 3 different dinners that mostly use what they already have: ${v}. It's fine to add a few common items. Make at least one a shortcut-friendly weeknight meal and one a gentle new flavor.`,3)},
  aicreate:()=>{const v=(S.ai.create||'').trim();if(!v){toast('Describe the dinner you want first.');return $('#create').focus()}aiRecipes('create',`Create one recipe for this request: ${v}`,1)},
  stop:()=>{if(ctl)ctl.abort()},
  phpick:()=>{const p=$('#photos');p.value='';p.click()},
  phdel:t=>{const i=Number(t.dataset.i),sc=S.scan;try{URL.revokeObjectURL(sc.urls[i])}catch(e){}sc.urls.splice(i,1);sc.files.splice(i,1);render(true)},
  phscan:()=>aiScan(),
  ftog:t=>{const f=S.scan.found[Number(t.dataset.i)];f.on=!f.on;render(true)},
  fdall:()=>{const all=S.scan.found.every(f=>f.on);S.scan.found.forEach(f=>f.on=!all);render(true)},

    S.inv.updated=Date.now();saveInv();S.scan.found=null;clearPhotos();S.scan.msg='';render(true);toast(`Added ${added} item${added===1?'':'s'} to On hand`)},

    if(open){render(true);aiPlan()}else{S.ai.fridge=onHandText();render(true);A.aifridge()}},
  clearres:()=>{S.ai.results=[];S.ai.msg='';render(true)},
  preview:t=>{S.sheet={type:'preview',i:Number(t.dataset.i),mode:'shortcut',servings:S.settings.servings};render(true)},

function fallbackCopy(txt,done){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy failed. Select the list and copy by hand.')}ta.remove()}

  else if(b.startsWith('note:')){const p=b.slice(5),id=S.sheet&&S.sheet.id,r=id&&S.recipes[id];if(!r)return;r.rating[p].note=t.value;const k=id+':'+p;clearTimeout(noteTimers[k]);noteTimers[k]=setTimeout(()=>saveRecipe(id),600)}
});

/* ---------- standalone backend shim ----------
   Talks to server.py over /api/*, standing in for the Claude Artifact
   db/sample capabilities this app was originally prototyped against. */
const POLL_MS=3000;
function fileToDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('read failed'));fr.readAsDataURL(file)})}
function dbShim(){
  const qs=p=>encodeURIComponent(p);
  function pollLoop(url,cb,errCb,shape){
    let stopped=false,last=null;
    (async function tick(){
      if(stopped)return;
      try{
        const res=await fetch(url);
        if(!res.ok)throw new Error('http '+res.status);
        const j=await res.json();
        const key=JSON.stringify(j);
        if(key!==last){last=key;cb(shape(j))}
      }catch(e){errCb&&errCb({code:'unknown'})}
      if(!stopped)setTimeout(tick,POLL_MS);
    })();
    return ()=>{stopped=true};
  }
  return {
    doc(path){
      return {
        async set(body){const res=await fetch(`/api/doc?path=${qs(path)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error('save failed')},
        async delete(){const res=await fetch(`/api/doc?path=${qs(path)}`,{method:'DELETE'});if(!res.ok)throw new Error('delete failed')},
        onSnapshot(cb,errCb){return pollLoop(`/api/doc?path=${qs(path)}`,cb,errCb,j=>({exists:!!j.exists,data:()=>j.data}))}
      };
    },
    collection(name){
      const prefix=name+'/';
      return {
        doc(){const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'');
          return {id,async set(body){const res=await fetch(`/api/doc?path=${qs(prefix+id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error('save failed')}};
        },
        onSnapshot(cb,errCb){return pollLoop(`/api/collection?prefix=${qs(prefix)}`,cb,errCb,list=>({docs:list.map(x=>({id:x.id,data:()=>x.data}))}))}
      };
    }
  };
}
function sampleShim(){
  return {
    async limits(){return {images:{maxCount:5,mediaTypes:['image/jpeg','image/png','image/webp','image/heic']}}},
    async json(prompt,opts){
      opts=opts||{};
      const body={prompt};
      if(opts.images&&opts.images.length)body.images=await Promise.all(opts.images.map(fileToDataURL));
      let res;
      try{res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:opts.signal})}
      catch(e){if(e.name==='AbortError')throw Object.assign(new Error('cancelled'),{code:'cancelled'});throw Object.assign(new Error('network'),{code:'unknown'})}
      let j={};try{j=await res.json()}catch(e){}
      if(res.status===429)throw Object.assign(new Error('rate limited'),{code:'rate_limited'});
      if(j&&j.error)throw Object.assign(new Error(j.error),{code:j.code||'unknown'});
      if(!res.ok)throw Object.assign(new Error('request failed'),{code:'unknown'});
      return j.result;
    }
  };
}

/* ---------- boot ---------- */
render(true);
S.db=dbShim();S.dbState='ok';S.sample=sampleShim();
(async()=>{
  try{S.imgLimit=await S.sample.limits()}catch(e){S.imgLimit={}}
  S.db.doc('inventory/current').onSnapshot(s=>{if(busy('inventory/current'))return;const d=s.exists?s.data():null;S.inv={items:clone((d&&d.items)||[]),updated:Number(d&&d.updated)||0};render()},onErr);
  S.db.collection('recipes').onSnapshot(q=>{const r={};q.docs.forEach(d=>{r[d.id]=normRecipe(d.data())});S.recipes=r;S.recipesLoaded=true;render()},onErr);
  S.db.doc('settings/family').onSnapshot(s=>{if(busy('settings/family'))return;const d=s.exists?s.data():null;S.settings={servings:Number(d&&d.servings)||4};render()},onErr);
  S.db.doc('pantry/staples').onSnapshot(s=>{if(busy('pantry/staples'))return;const d=s.exists?s.data():null;S.pantry={items:clone((d&&d.items)||[])};render()},onErr);
  subWeek();render(true);
})();
})();
